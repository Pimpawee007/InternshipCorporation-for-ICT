<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006C6C">
    <title>Admin - Internship Corporation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
        <symbol id="i-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
    </svg>

    <div class="login-wrap" id="loginWrap">
        <div class="login-memo">
            <img src="assets/character/shy.webp" alt="Memo กำลังเขินอาย" width="448" height="560">
            <div class="speech-bubble bubble-left">พื้นที่ของแอดมินนะ...<br>ขอรหัสหน่อยน้า</div>
        </div>
        <div class="admin-container" id="loginSection">
            <h2 class="login-title"><svg class="icon"><use href="#i-lock"/></svg>เข้าสู่ระบบผู้ดูแล (Admin)</h2>
            <form class="login-form" id="loginForm">
                <input type="text" id="username" placeholder="Username" autocomplete="username" required>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="btn-login">Login</button>
                <a href="index.html" class="back-link">กลับหน้าหลัก</a>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="admin-container" id="adminPanel">
            <div class="header-flex">
                <div>
                    <h2><svg class="icon"><use href="#i-dashboard"/></svg>จัดการข้อมูลบริษัท</h2>
                    <span class="count-pill" id="adminCount"></span>
                </div>
                <div class="admin-actions">
                    <a href="index.html" class="btn-outline"><svg class="icon"><use href="#i-eye"/></svg>ดูหน้าเว็บ</a>
                    <button onclick="logout()" class="btn-logout"><svg class="icon"><use href="#i-logout"/></svg>ออกจากระบบ</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ชื่อบริษัท</th>
                            <th>ประเภท</th>
                            <th>สถานที่</th>
                            <th>ติดต่อ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="companyTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="edit-modal-content">
            <h3 class="edit-title"><svg class="icon"><use href="#i-pencil"/></svg>แก้ไขข้อมูลบริษัท</h3>
            <form id="editForm" class="edit-form">
                <input type="hidden" id="editId">

                <label for="editName">ชื่อบริษัท</label>
                <input type="text" id="editName" required>

                <label for="editLoc">สถานที่ตั้ง</label>
                <input type="text" id="editLoc" required>

                <label for="editSector">ประเภท (Sector)</label>
                <select id="editSector" required>
                    <option value="เอกชน">เอกชน</option>
                    <option value="ภาครัฐ">ภาครัฐ</option>
                    <option value="รัฐวิสาหกิจ">รัฐวิสาหกิจ</option>
                </select>

                <label for="editDesc">คำอธิบายพอสังเขป</label>
                <textarea id="editDesc" rows="3"></textarea>

                <label for="editPay">ค่าตอบแทน</label>
                <input type="text" id="editPay">

                <label for="editPos">ตำแหน่งงานที่เปิดรับ</label>
                <input type="text" id="editPos">

                <label for="editTime">ระยะเวลา</label>
                <input type="text" id="editTime">

                <label for="editContact">ช่องทางติดต่อ</label>
                <input type="text" id="editContact">

                <label for="editTags">Tags สำหรับค้นหา (คั่นด้วยลูกน้ำ ,)</label>
                <input type="text" id="editTags" placeholder="เช่น ภาคกลาง, มีค่าตอบแทน">

                <div class="edit-actions">
                    <button type="submit" class="btn-save">บันทึกการแก้ไข</button>
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let companiesCache = [];

        const SECTOR_CLASS = { 'ภาครัฐ': 'gov-sector', 'เอกชน': 'private-sector', 'รัฐวิสาหกิจ': 'state-sector' };

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        if (sessionStorage.getItem('adminToken')) {
            showPanel();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    showPanel();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('ไม่สามารถเชื่อมต่อ Server ได้');
            }
        });

        function showPanel() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        }

        function logout() {
            sessionStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadData() {
            const res = await fetch(`${API_URL}/companies`);
            companiesCache = await res.json();
            const tbody = document.getElementById('companyTableBody');
            document.getElementById('adminCount').textContent = `ทั้งหมด ${companiesCache.length} บริษัท`;

            if (companiesCache.length === 0) {
                tbody.innerHTML = '<tr><td class="admin-empty" colspan="5">ยังไม่มีข้อมูลบริษัท</td></tr>';
                return;
            }

            let rows = '';
            companiesCache.forEach(c => {
                let contactHTML = '-';
                if(c.contact) {
                    if(c.contact.startsWith('http') || c.contact.startsWith('www.')) {
                        let url = c.contact.startsWith('www.') ? 'http://' + c.contact : c.contact;
                        contactHTML = `<a href="${escapeHTML(url)}" target="_blank" rel="noopener" class="link-break">${escapeHTML(c.contact)}</a>`;
                    } else {
                        contactHTML = escapeHTML(c.contact);
                    }
                }

                rows += `
                    <tr>
                        <td class="cell-break td-name" data-label="ชื่อบริษัท">${escapeHTML(c.name)}</td>
                        <td data-label="ประเภท"><span class="sector-tag ${SECTOR_CLASS[c.sector] || ''}">${escapeHTML(c.sector)}</span></td>
                        <td class="cell-break" data-label="สถานที่">${escapeHTML(c.loc)}</td>
                        <td class="cell-break" data-label="ติดต่อ">${contactHTML}</td>
                        <td class="td-actions">
                            <button class="btn-edit" onclick="openEditModal('${escapeHTML(c.id)}')"><svg class="icon"><use href="#i-pencil"/></svg>แก้ไข</button>
                            <button class="btn-del" onclick="deleteCompany('${escapeHTML(c.id)}')"><svg class="icon"><use href="#i-trash"/></svg>ลบ</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = rows;
        }

        async function deleteCompany(id) {
            if(confirm('คุณแน่ใจหรือไม่ที่จะลบข้อมูลนี้?')) {
                await fetch(`${API_URL}/companies/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        function openEditModal(id) {
            const data = companiesCache.find(c => c.id === id);
            if (!data) return;

            document.getElementById('editId').value = data.id;
            document.getElementById('editName').value = data.name || '';
            document.getElementById('editLoc').value = data.loc || '';
            document.getElementById('editSector').value = data.sector || 'เอกชน';
            document.getElementById('editDesc').value = data.desc || '';
            document.getElementById('editPay').value = data.pay || '';
            document.getElementById('editPos').value = data.pos || '';
            document.getElementById('editTime').value = data.time || '';
            document.getElementById('editContact').value = data.contact || '';

            const tagsStr = data.tags ? data.tags.join(', ') : '';
            document.getElementById('editTags').value = tagsStr;

            document.getElementById('editModal').style.display = 'flex';
            document.body.classList.add('modal-open');
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            document.body.classList.remove('modal-open');
        }

        // คลิกพื้นหลัง หรือกด Esc เพื่อปิด
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEditModal(); });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;

            const rawTags = document.getElementById('editTags').value;
            const tagsArray = rawTags.split(',').map(t => t.trim()).filter(t => t.length > 0);

            const payload = {
                name: document.getElementById('editName').value,
                loc: document.getElementById('editLoc').value,
                sector: document.getElementById('editSector').value,
                desc: document.getElementById('editDesc').value,
                pay: document.getElementById('editPay').value,
                pos: document.getElementById('editPos').value,
                time: document.getElementById('editTime').value,
                contact: document.getElementById('editContact').value,
                tags: tagsArray
            };

            try {
                const res = await fetch(`${API_URL}/companies/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(result.success) {
                    alert('แก้ไขข้อมูลเรียบร้อยแล้ว!');
                    closeEditModal();
                    loadData();
                } else {
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                }
            } catch (err) {
                alert('ไม่สามารถเชื่อมต่อ Server ได้');
            }
        });
    </script>
</body>
</html>
