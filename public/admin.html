<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006C6C">
    <meta name="robots" content="noindex">
    <title>Admin - Internship Corporation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="common.js" defer></script>
    <script src="admin.js" defer></script>
</head>
<body class="admin-body">

    <div class="login-wrap" id="loginWrap">
        <div class="login-memo">
            <img src="assets/character/shy.webp" alt="Memo กำลังเขินอาย" width="448" height="560">
            <div class="speech-bubble bubble-left">พื้นที่ของแอดมินนะ...<br>ขอรหัสหน่อยน้า</div>
        </div>
        <div class="admin-container" id="loginSection">
            <h2 class="login-title"><svg class="icon"><use href="#i-lock"/></svg>เข้าสู่ระบบผู้ดูแล (Admin)</h2>
            <form class="login-form" id="loginForm">
                <input type="text" id="username" placeholder="Username" autocomplete="username" required>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" class="btn-login">Login</button>
                <a href="index.html" class="back-link">กลับหน้าหลัก</a>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="admin-container" id="adminPanel">
            <div class="header-flex">
                <div>
                    <h2><svg class="icon"><use href="#i-dashboard"/></svg>จัดการข้อมูลบริษัท</h2>
                    <span class="count-pill" id="adminCount"></span>
                </div>
                <div class="admin-actions">
                    <a href="index.html" class="btn-outline"><svg class="icon"><use href="#i-eye"/></svg>ดูหน้าเว็บ</a>
                    <button onclick="logout()" class="btn-logout"><svg class="icon"><use href="#i-logout"/></svg>ออกจากระบบ</button>
                </div>
            </div>

            <div class="admin-tabs" role="tablist">
                <button type="button" class="admin-tab active" role="tab" data-tab="pending" aria-selected="true"><svg class="icon"><use href="#i-inbox"/></svg>รออนุมัติ<span class="tab-badge" id="badgePending"></span></button>
                <button type="button" class="admin-tab" role="tab" data-tab="companies" aria-selected="false"><svg class="icon"><use href="#i-building"/></svg>บริษัททั้งหมด</button>
                <button type="button" class="admin-tab" role="tab" data-tab="reviews" aria-selected="false"><svg class="icon"><use href="#i-message"/></svg>รีวิว</button>
                <button type="button" class="admin-tab" role="tab" data-tab="reports" aria-selected="false"><svg class="icon"><use href="#i-flag"/></svg>แจ้งข้อมูลผิด<span class="tab-badge" id="badgeReports"></span></button>
            </div>

            <!-- รออนุมัติ -->
            <div class="admin-pane" id="pane-pending">
                <h3 class="pane-title">บริษัทที่ส่งเข้ามาใหม่</h3>
                <div id="pendingCompanies" class="admin-cards"></div>
                <h3 class="pane-title">รีวิวที่รอตรวจ</h3>
                <div id="pendingReviews" class="admin-cards"></div>
            </div>

            <!-- บริษัททั้งหมด -->
            <div class="admin-pane hidden" id="pane-companies">
                <label class="search-field admin-search">
                    <svg class="icon"><use href="#i-search"/></svg>
                    <input type="text" id="adminSearch" placeholder="ค้นหาชื่อบริษัท...">
                </label>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ชื่อบริษัท</th>
                                <th>ประเภท</th>
                                <th>สถานที่</th>
                                <th>ติดต่อ</th>
                                <th>จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="companyTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- รีวิวทั้งหมด -->
            <div class="admin-pane hidden" id="pane-reviews">
                <div id="allReviews" class="admin-cards"></div>
            </div>

            <!-- แจ้งข้อมูลผิด -->
            <div class="admin-pane hidden" id="pane-reports">
                <div id="reportList" class="admin-cards"></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="edit-modal-content">
            <h3 class="edit-title"><svg class="icon"><use href="#i-pencil"/></svg>แก้ไขข้อมูลบริษัท</h3>
            <form id="editForm" class="edit-form">
                <input type="hidden" id="editId">

                <label for="editStatus">สถานะ</label>
                <select id="editStatus">
                    <option value="approved">อนุมัติแล้ว (แสดงบนเว็บ)</option>
                    <option value="pending">รออนุมัติ (ซ่อน)</option>
                </select>

                <label for="editName">ชื่อบริษัท</label>
                <input type="text" id="editName" required>

                <label for="editLoc">สถานที่ตั้ง</label>
                <input type="text" id="editLoc" required>

                <label for="editSector">ประเภท (Sector)</label>
                <select id="editSector" required>
                    <option value="เอกชน">เอกชน</option>
                    <option value="ภาครัฐ">ภาครัฐ</option>
                    <option value="รัฐวิสาหกิจ">รัฐวิสาหกิจ</option>
                </select>

                <label for="editDesc">คำอธิบายพอสังเขป</label>
                <textarea id="editDesc" rows="3"></textarea>

                <label for="editPay">ค่าตอบแทน</label>
                <input type="text" id="editPay">

                <label for="editPos">ตำแหน่งงานที่เปิดรับ</label>
                <input type="text" id="editPos">

                <label>ระยะเวลาการรับสมัคร</label>
                <div class="date-group">
                    <div>
                        <label class="sub-label" for="editTimeStart">วันที่เริ่ม</label>
                        <input type="date" id="editTimeStart">
                    </div>
                    <div>
                        <label class="sub-label" for="editTimeEnd">วันที่สิ้นสุด</label>
                        <input type="date" id="editTimeEnd">
                    </div>
                </div>
                <label class="sub-label" for="editTime">หรือเขียนเป็นข้อความ (ใช้เมื่อไม่ได้ใส่วันที่)</label>
                <input type="text" id="editTime" placeholder="เช่น รับตลอดปี">

                <label for="editContact">ช่องทางติดต่อ</label>
                <input type="text" id="editContact">

                <label for="editTags">Tags สำหรับค้นหา (คั่นด้วยลูกน้ำ ,)</label>
                <input type="text" id="editTags" placeholder="เช่น ภาคกลาง, มีค่าตอบแทน, Backend, Hybrid">
                <p class="field-hint" id="editTagHint"></p>

                <div class="edit-actions">
                    <button type="submit" class="btn-save">บันทึกการแก้ไข</button>
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <div id="memoToast" class="toast" role="status" aria-live="polite">
        <img id="memoToastImg" src="assets/character/excited.webp" alt="" width="479" height="560">
        <p id="memoToastText"></p>
    </div>
</body>
</html>
